<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>🎵 Music Time Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --accent-us: #ff4d6d;
    --accent-il: #4ecdc4;
    --accent-yellow: #ffe66d;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --vinyl-size: 180px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 20px;
    position: relative;
  }

  /* Background stars */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.1) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    text-align: center;
    z-index: 1;
  }

  .header h1 {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent-us), var(--accent-yellow), var(--accent-il));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }

  .header p {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Vinyl */
  .vinyl-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .vinyl {
    width: var(--vinyl-size);
    height: var(--vinyl-size);
    border-radius: 50%;
    background: radial-gradient(circle at center,
      #1a1a1a 0%,
      #111 18%,
      #222 18.5%,
      #0d0d0d 22%,
      #1a1a1a 30%,
      #0d0d0d 38%,
      #1a1a1a 46%,
      #0d0d0d 54%,
      #1a1a1a 62%,
      #0d0d0d 70%,
      #1a1a1a 80%,
      #0d0d0d 90%,
      #1a1a1a 100%
    );
    box-shadow: 0 0 40px rgba(255, 77, 109, 0.2), 0 8px 32px rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: box-shadow 0.3s;
  }

  .vinyl.spinning {
    animation: spin 3s linear infinite;
    box-shadow: 0 0 60px rgba(255, 77, 109, 0.4), 0 0 20px rgba(78, 205, 196, 0.2), 0 8px 32px rgba(0,0,0,0.7);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .vinyl-center {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    overflow: hidden;
    position: absolute;
    z-index: 2;
  }

  .vinyl-center img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: none;
  }

  .vinyl-center .emoji {
    font-size: 1.3rem;
  }

  /* Song info badge */
  .song-badge {
    text-align: center;
    min-height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .song-badge .year-tag {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent-yellow);
    display: none;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255, 230, 109, 0.5);
  }

  .song-badge .song-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    display: none;
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-badge .song-artist {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    display: none;
    letter-spacing: 0.05em;
  }

  .song-badge .source-tag {
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.08em;
    display: none;
    margin-top: 2px;
  }

  .source-tag.american {
    background: rgba(255, 77, 109, 0.15);
    color: var(--accent-us);
    border: 1px solid rgba(255, 77, 109, 0.3);
  }

  .source-tag.hebrew {
    background: rgba(78, 205, 196, 0.15);
    color: var(--accent-il);
    border: 1px solid rgba(78, 205, 196, 0.3);
  }

  .song-badge .placeholder {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Slider section */
  .slider-section {
    width: 100%;
    max-width: 320px;
    z-index: 1;
  }

  .slider-labels {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .slider-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .slider-label.us { color: var(--accent-us); }
  .slider-label.il { color: var(--accent-il); }

  .slider-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent-yellow);
    text-align: center;
    min-width: 80px;
  }

  .slider-track {
    position: relative;
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    overflow: visible;
  }

  .slider-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent-us), var(--accent-il));
    transition: width 0.1s;
    pointer-events: none;
  }

  input[type=range] {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-yellow);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(255, 230, 109, 0.5);
    cursor: pointer;
  }

  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-yellow);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(255, 230, 109, 0.5);
    cursor: pointer;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 320px;
    z-index: 1;
  }

  .btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-login {
    background: linear-gradient(135deg, #1DB954, #17a349);
    color: #000;
  }

  .btn-new {
    background: linear-gradient(135deg, var(--accent-us), #c9364f);
    color: #fff;
  }

  .btn-reveal {
    background: linear-gradient(135deg, var(--accent-yellow), #f0c040);
    color: #000;
  }

  .btn-pause {
    flex: 0 0 48px;
    padding: 12px 0;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn:hover:not(:disabled) {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  /* Loading spinner on btn */
  .btn-new.loading::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
  }

  /* Year not found note */
  .year-unknown {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: var(--muted);
    text-align: center;
    display: none;
    margin-top: 2px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🎵 Music Time Machine</h1>
  <p>Spin the dial. Feel the era.</p>
</div>

<!-- Vinyl + song info -->
<div class="vinyl-wrap">
  <div class="vinyl" id="vinyl">
    <div class="vinyl-center" id="vinylCenter">
      <span class="emoji" id="vinylEmoji">🎵</span>
      <img id="vinylImg" src="" alt="album"/>
    </div>
  </div>

  <div class="song-badge" id="songBadge">
    <span class="placeholder" id="placeholder">— press new song —</span>
    <span class="year-tag" id="yearTag"></span>
    <span class="song-title" id="songTitle"></span>
    <span class="song-artist" id="songArtist"></span>
    <span class="source-tag" id="sourceTag"></span>
  </div>
  <div class="year-unknown" id="yearUnknown"></div>
</div>

<!-- Slider -->
<div class="slider-section">
  <div class="slider-labels">
    <span class="slider-label us">🇺🇸 American</span>
    <span class="slider-value" id="sliderValue">Mix: 50% 🇮🇱</span>
    <span class="slider-label il">Israeli 🇮🇱</span>
  </div>
  <div class="slider-track">
    <div class="slider-fill" id="sliderFill" style="width:50%"></div>
    <input type="range" id="ratioSlider" min="0" max="100" value="50"/>
  </div>
</div>

<!-- Buttons -->
<div class="btn-row">
  {% if logged_in %}
    <button class="btn btn-login" onclick="window.location='/logout'">🚪 Logout</button>
  {% else %}
    <button class="btn btn-login" onclick="window.location='/login'">🎧 Login</button>
  {% endif %}
  <button class="btn btn-new" id="btnNew" onclick="newSong()">🎲 New Song</button>
  <button class="btn btn-reveal" id="btnReveal" onclick="toggleReveal()" disabled>👁 Reveal</button>
  <button class="btn btn-pause" id="btnPause" onclick="togglePause()" disabled>▶</button>
</div>

<script>
  let revealed = false;
  let isPlaying = false;
  let isPaused = false;
  let currentSong = null;

  // Slider
  const slider = document.getElementById('ratioSlider');
  const sliderFill = document.getElementById('sliderFill');
  const sliderValue = document.getElementById('sliderValue');

  slider.addEventListener('input', () => {
    const v = slider.value;
    sliderFill.style.width = v + '%';
    if (v == 0) sliderValue.textContent = '100% 🇺🇸 American';
    else if (v == 100) sliderValue.textContent = '100% 🇮🇱 Israeli';
    else sliderValue.textContent = `Mix: ${v}% 🇮🇱`;
  });

  // New song
  async function newSong() {
    const btn = document.getElementById('btnNew');
    btn.disabled = true;
    btn.textContent = '⏳ Loading...';
    btn.classList.add('loading');

    // Reset reveal
    resetReveal();

    try {
      const res = await fetch('/api/random-song', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ israeli_ratio: parseInt(slider.value) })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }

      currentSong = data;
      isPlaying = true;
      isPaused = false;

      // Spin vinyl
      document.getElementById('vinyl').classList.add('spinning');

      // Store data for reveal
      document.getElementById('yearTag').textContent = data.year || '?';
      document.getElementById('songTitle').textContent = data.title;
      document.getElementById('songArtist').textContent = data.artist;

      const sourceTag = document.getElementById('sourceTag');
      sourceTag.textContent = data.source === 'hebrew' ? '🇮🇱 Israeli' : '🇺🇸 American';
      sourceTag.className = 'source-tag ' + (data.source === 'hebrew' ? 'hebrew' : 'american');

      if (data.album_image) {
        document.getElementById('vinylImg').src = data.album_image;
      }

      const yearNote = document.getElementById('yearUnknown');
      if (data.source === 'hebrew' && !data.year) {
        yearNote.textContent = '⚠️ Year not found';
        yearNote.style.display = 'block';
      } else if (data.source === 'hebrew' && data.year_source === 'spotify') {
        yearNote.textContent = '📅 Year from Spotify (may be approximate)';
        yearNote.style.display = 'block';
      } else {
        yearNote.style.display = 'none';
      }

      // Enable buttons
      document.getElementById('btnReveal').disabled = false;
      document.getElementById('btnPause').disabled = false;
      document.getElementById('btnPause').textContent = '⏸';

    } catch (e) {
      console.error(e);
      alert('Something went wrong, try again!');
    } finally {
      btn.disabled = false;
      btn.textContent = '🎲 New Song';
      btn.classList.remove('loading');
    }
  }

  // Reveal / hide
  function toggleReveal() {
    const btn = document.getElementById('btnReveal');
    if (!revealed) {
      showReveal();
      btn.textContent = '🙈 Hide';
      revealed = true;
    } else {
      hideReveal();
      btn.textContent = '👁 Reveal';
      revealed = false;
    }
  }

  function showReveal() {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('yearTag').style.display = 'block';
    document.getElementById('songTitle').style.display = 'block';
    document.getElementById('songArtist').style.display = 'block';
    document.getElementById('sourceTag').style.display = 'inline-block';

    // Show album art in vinyl center
    const img = document.getElementById('vinylImg');
    const emoji = document.getElementById('vinylEmoji');
    if (currentSong && currentSong.album_image) {
      img.style.display = 'block';
      emoji.style.display = 'none';
    }
  }

  function hideReveal() {
    document.getElementById('placeholder').style.display = 'block';
    document.getElementById('yearTag').style.display = 'none';
    document.getElementById('songTitle').style.display = 'none';
    document.getElementById('songArtist').style.display = 'none';
    document.getElementById('sourceTag').style.display = 'none';

    // Hide album art in vinyl
    document.getElementById('vinylImg').style.display = 'none';
    document.getElementById('vinylEmoji').style.display = 'block';
  }

  function resetReveal() {
    revealed = false;
    const btn = document.getElementById('btnReveal');
    btn.textContent = '👁 Reveal';
    hideReveal();
    document.getElementById('yearUnknown').style.display = 'none';
    document.getElementById('vinyl').classList.remove('spinning');
    document.getElementById('btnPause').textContent = '▶';
    document.getElementById('btnPause').disabled = true;
  }

  // Pause / resume
  async function togglePause() {
    const btn = document.getElementById('btnPause');
    if (!isPaused) {
      await fetch('/api/pause', { method: 'POST' });
      isPaused = true;
      btn.textContent = '▶';
      document.getElementById('vinyl').classList.remove('spinning');
    } else {
      await fetch('/api/resume', { method: 'POST' });
      isPaused = false;
      btn.textContent = '⏸';
      document.getElementById('vinyl').classList.add('spinning');
    }
  }
</script>
</body>
</html>
